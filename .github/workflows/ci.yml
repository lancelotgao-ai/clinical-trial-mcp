name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan full history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal account: GITLEAKS_LICENSE is not required.
          # Comments stay off so this job only scans.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: "8.30.1"

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Syntax check
        run: python -m compileall -q -f chinadrugtrials_mcp server.py
      - name: Build
        run: |
          python -m pip install build
          python -m build
